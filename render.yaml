services:
  - type: web
    name: theoverlook
    runtime: static
    # The HTML is generated by tools/build.py and committed, so the deploy only
    # assembles the public files — no Python needed in Render's build image.
    # Run `python3 tools/build.py && python3 tools/lint.py` before committing.
    buildCommand: rm -rf dist && mkdir -p dist && cp -R *.html *.txt *.xml assets dist/
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
