services:
  - type: web
    name: theoverlook
    runtime: static
    # The HTML is generated by tools/build.py and committed, so the deploy only
    # assembles the public files — no Python needed in Render's build image.
    # Run `python3 tools/build.py && python3 tools/lint.py` before committing.
    # NOTE: this list is explicit. A new top-level output directory must be
    # added here or it will not be published.
    buildCommand: rm -rf dist && mkdir -p dist && cp -R *.html *.txt *.xml assets journal privacy terms dist/
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # The domain currently serves a live, indexed site with 19 URLs, none of
    # which exist in this build. These preserve the twelve that have a clear
    # equivalent; the other six are generated as real pages at their exact
    # paths. Render's routes do not glob, so each path is explicit.
    routes:
      - type: redirect
        source: /wedding-experiences
        destination: /weddings.html
      - type: redirect
        source: /wedding-venues-montana
        destination: /weddings.html
      - type: redirect
        source: /helicopter-experiences
        destination: /weddings.html
      - type: redirect
        source: /corporate-retreats
        destination: /retreats.html
      - type: redirect
        source: /wellness-retreats
        destination: /wellness.html
      - type: redirect
        source: /stay-onsite
        destination: /estate.html
      - type: redirect
        source: /gallery
        destination: /gallery.html
      - type: redirect
        source: /about
        destination: /story.html
      - type: redirect
        source: /contact
        destination: /contact.html
      - type: redirect
        source: /book
        destination: /contact.html
      - type: redirect
        source: /private-events
        destination: /weddings.html
      - type: redirect
        source: /things-to-do
        destination: /journal/getting-to-the-overlook-travel-guide
